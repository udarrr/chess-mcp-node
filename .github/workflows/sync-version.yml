name: Sync Version

on:
  pull_request:
    paths:
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - 'package.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.9.0'

      - name: Extract version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Update server.json
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          jq --arg version "$VERSION" '
            .version = $version
            | (.packages[] | select(.registryType == "npm") | .version) = $version
          ' server.json > server.json.tmp
          mv server.json.tmp server.json
          echo "Updated server.json with version $VERSION"

      - name: Check for changes
        id: check_changes
        run: |
          git diff --exit-code server.json || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add server.json
          git commit -m "chore: sync version to ${{ steps.get_version.outputs.version }}"
          git push
